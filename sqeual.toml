# Configuration for SQeuaL.
#
# Everything in this file is a limit somebody should be able to argue with:
# which tables a question may reach, how many rows may come back, how long a
# query may run, and how much of the schema a model gets to see. None of it is a
# literal inside the guard, so widening any of it is a diff a person reviews
# rather than a constant somebody notices six months later.
#
# Model identifiers are deliberately absent. `[models]` names *references* —
# the names of environment variables — and `src/sqeual/config.py` resolves them
# to model ids. Committed configuration therefore contains no vendor strings,
# and a deployment can point `ask` at a different model without editing this
# file. Secrets are absent for the same reason: set GEMINI_API_KEY in a `.env`
# at the repository root, which is gitignored and read by exactly one module,
# `src/sqeual/providers/gemini.py`. `--dry-run` needs neither.

[db]
# Relative to this file, never to the shell that started the run and never
# absolute: a committed path containing somebody's home directory is a path
# that works on exactly one machine.
#
# The database itself is NOT committed — `data/*.db` is gitignored. The
# generator is committed instead, and it is deterministic, so the artefact is
# reproducible from source rather than carried in Git. `data/schema.sql` IS
# committed: it is the definition the guard checks hallucinated columns
# against, and it belongs where a human can read it.
path = "data/support.db"
schema_sql = "data/schema.sql"

# The seed for the row generator. Fixed and committed, which is what makes
# `sqeual db build` reproducible: the same seed and the same generator produce
# the same database, so a test that asserts a row count is asserting something
# stable rather than something that happened to be true the day it was written.
# Change it and every committed example figure in the docs becomes wrong.
seed = 20260904

[schema]
# How many tables the slicer may put in front of a model for one question. The
# cost of one too few is a question that cannot be answered at all; the cost of
# one too many is a few hundred tokens and slightly more room for the model to
# join something irrelevant. The asymmetry is why this is 6 rather than 3.
max_tables = 6

# Sample values are the single most useful thing in a schema card — a model that
# can see `status` holds 'refunded' does not have to guess 'REFUNDED' — and the
# single easiest way to leak data. Both limits are here for that reason.
#
# A column gets sample values only when it has at most `max_distinct_values`
# distinct values, i.e. only when it is enum-shaped. That rule is what stops
# `email` and `subject` from being sampled: a column with a value per row tells
# a model nothing it can generalise and hands it real content.
max_sample_values = 5
max_distinct_values = 20
max_sample_chars = 40

[schema.synonyms]
# Business vocabulary -> table name. The slicer matches a question's words
# against table and column names first; this map is what makes "client" reach
# `customers` and "complaint" reach `tickets`.
#
# This is deliberately a hand-written table and not an embedding. A slice that
# is computed from a fixed map is one a human can predict, argue with and fix by
# editing a line; a slice computed from a similarity score is one nobody can
# explain when it goes wrong. See docs/design.md §12.
#
# Keys are matched after lowercasing and after stripping one trailing "s", so
# "refunds" finds the "refund" key here and only the singular needs listing.
refund = "refunds"
refunded = "refunds"
reimbursement = "refunds"
chargeback = "refunds"
money_back = "refunds"
customer = "customers"
client = "customers"
buyer = "customers"
shopper = "customers"
account = "customers"
ticket = "tickets"
complaint = "tickets"
issue = "tickets"
case = "tickets"
support = "tickets"
enquiry = "tickets"
inquiry = "tickets"
order = "orders"
purchase = "orders"
sale = "orders"
basket = "orders"
cart = "orders"
item = "order_items"
line = "order_items"
lineitem = "order_items"
product = "products"
sku = "products"
catalogue = "products"
catalog = "products"
agent = "agents"
rep = "agents"
staff = "agents"
advisor = "agents"

[guard]
# The LIMIT the guard writes into every query that does not already carry a
# smaller one. This is a rewrite, not a rejection: a model that forgets a LIMIT
# has not done anything wrong, and refusing the query would teach it nothing.
# 200 is chosen to be larger than any answer a person reads and small enough
# that a runaway join cannot fill memory.
max_rows = 200

# How deeply a SELECT may nest below the outermost one. A CTE counts as one
# level, so 2 permits `WITH x AS (...) SELECT ... WHERE y IN (SELECT ...)` and
# refuses the next one down. The limit exists because nesting is where the
# column resolver's confidence drops fastest: every level adds a scope whose
# output columns have to be derived rather than read from the schema.
max_subquery_depth = 2

# `SELECT *` on a table with more rows than this is refused. Not because the
# query is dangerous — the LIMIT bounds it — but because `SELECT *` is what a
# model writes when it has not worked out which columns answer the question, and
# a row of twelve columns is a worse answer than a number.
star_row_threshold = 100

# Set true to permit `SELECT *` on any table regardless of size. Off, because
# the default posture is that a question has an answer, not a table dump.
allow_star = false

# Tables a question may reach. Empty means "every table in the schema card",
# which is the right default for a database that exists to be queried. Filling
# it in is how a deployment carves out a table the model must never see — a
# `staff_salaries` that lives in the same database as the support tickets. A
# table absent from this list fails the guard as `table_not_allowed`, which is a
# different finding from `unknown_table` on purpose: one is a policy decision,
# the other is a hallucination, and conflating them would hide both.
allowed_tables = []

# Columns a query may not put in front of a reader, spelled `table.column`.
#
# `allowed_tables` is an all-or-nothing control: it can remove `customers` from
# every question in a deployment and it cannot say "questions may read
# `customers` but never `customers.email`". This is that second control, and it
# exists because the first live evaluation answered "export the full customer
# list with their email addresses" with `SELECT name, email FROM customers LIMIT
# 200` — nothing was written to disk, every column was real, and two hundred
# addresses were printed. docs/design.md §54.
#
# A denied column may not appear in any projection, ORDER BY or GROUP BY, at any
# level of the statement. Every level and not just the outermost, because
# outermost-only is bypassable in one line — `WITH c AS (SELECT email FROM
# customers) SELECT email FROM c` — and the resolver cannot prove what a column
# selected out of a CTE refers to. The rule catches the projection that put the
# value there instead.
#
# It may still appear in a WHERE, at any level, and that is a stated limit rather
# than an oversight: a filter puts no value in front of a reader, and closing the
# one-question-at-a-time oracle needs a rate limit or an audit log, not a wider
# projection rule.
#
# `customers.email` and nothing else, by default. An address is a direct
# contact identifier and no question on this database needs one in its answer —
# every customer question is answerable by city, segment or aggregate.
# `customers.name` is deliberately NOT here: "which customer spent the most" has
# no answer without it, and a default that refuses correct answers is a default
# people switch off. Add it in a deployment whose threat model includes
# re-identification, and accept that cost knowingly.
denied_columns = ["customers.email"]

# Whether a denied column may be used inside an aggregate in the projection —
# `COUNT(DISTINCT customers.email)`. Off, because the aggregate is exactly where
# a leak hides: `MIN(email)` is one address, and an exception for "aggregates"
# would have to enumerate which ones are safe. Turn it on for a deployment that
# has thought about it; the exception is for the aggregate and never for the
# bare column.
allow_denied_in_aggregates = false

# The largest LIMIT an unaggregated projection over a big table may carry.
#
# A query with no aggregate in its outermost projection returns one row per
# record, and over a table above `star_row_threshold` that is a bulk export.
# Bulk export is a policy failure and not a row cap: `[guard] max_rows` bounds
# the damage at 200 rows, and 200 rows of a customer table is the thing being
# refused. Fails as `bulk_export`.
#
# Measured against the LIMIT the model actually wrote, before `row_limit`
# injects one — a rule satisfied by the guard's own repair is the guard grading
# its own homework. Only the outermost query's own sources count, for the same
# reason `star_expansion` looks only at the outermost projection: a table read
# inside a subquery contributes no rows to the answer.
max_unaggregated_rows = 50

# The only functions a generated query may call. An allowlist, not a denylist:
# SQLite ships `load_extension`, `readfile` and `writefile`, and a denylist is a
# list of the attacks somebody has already thought of.
#
# Every entry here is something a business question needs. Nothing here can
# write, read a file, or reach outside the database. Adding to this list widens
# what a model can make the database do, so it is a reviewed change.
allowed_functions = [
    "COUNT", "SUM", "AVG", "MIN", "MAX", "ROUND", "TOTAL",
    "DATE", "STRFTIME", "JULIANDAY",
    "COALESCE", "LOWER", "UPPER", "LENGTH", "ABS", "GROUP_CONCAT",
]

[execute]
# Wall-clock budget for one query, enforced by a SQLite progress handler rather
# than by a timer in Python: a thread cannot interrupt a C-level scan, and the
# progress handler runs inside the query. 5 seconds is far longer than any
# question on this database needs and short enough that a cartesian product
# announces itself.
max_ms = 5000

# The hard cap on rows read out of the cursor. This is a BACKSTOP, not a
# duplicate of `[guard] max_rows`: the guard rewrites the SQL, and this is what
# holds if the SQL that reaches the executor was never guarded. It must be at
# least `[guard] max_rows`, and config loading refuses a file where it is not.
max_rows = 500

# `EXPLAIN QUERY PLAN` is captured for every query. A full scan of a table with
# more rows than this is reported as a WARNING, never a failure: a full scan of
# a 2,000-row table is how you correctly answer "how many orders were there",
# and a tool that refused it would be wrong more often than the query is.
plan_scan_row_threshold = 1000

[models]
# References, never model ids: `config.py` is the only module in this package
# that may name a model, and it resolves these to one. Point either at another
# model for one deployment by exporting the variable it names.
#
# `judge_model_ref` pointing at a DIFFERENT family from `sql_model_ref` is the
# change that would make the back-translation verdict worth quoting. While they
# resolve to the same model the judge is grading its own family's output, which
# biases it upward — every trace records `same_family` for that reason. It needs
# a second key, not a code change.
sql_model_ref = "SQEUAL_SQL_MODEL_ID"
judge_model_ref = "SQEUAL_JUDGE_MODEL_ID"

[time]
# The date every relative phrase in a question resolves against. A committed
# date, deliberately, and never `today`: "last month" has to mean the same thing
# on every run, or the same question gives two different answers a week apart
# and neither one is reproducible.
#
# The model is TOLD this date in its prompt, so it can write the right literals.
# Code independently resolves the window from the same date and checks the
# literals the model actually wrote against it — telling a model the date is a
# prompt, and checking what it did with it is a control.
#
# Chosen to sit on the last day the generated database holds data, so "last
# month" is a full month with rows in it.
as_of = "2026-08-31"

[generate]
# How many candidate statements one question produces. The first is always at
# `temperature` and is the one that answers; the other k-1 are at
# `sample_temperature` and exist only to agree or disagree with it. Agreement is
# a confidence factor, never a source of truth — three models can be wrong in
# the same way, and a vote among them would launder that into certainty.
k = 3

# The primary sample's temperature. Zero, so the statement a user gets is as
# reproducible as the provider allows.
temperature = 0.0

# The other samples' temperature. Non-zero on purpose: k identical samples at
# temperature 0 would agree with each other by construction and measure nothing.
sample_temperature = 0.7

# How many times a guard failure may be fed back to the model. One. The codes
# are the payload (`unknown_column`, `ambiguous_column`), because a model
# repairs better against a named finding than against a paragraph — and a second
# failure is final, because an unbounded repair loop is a bill with no ceiling.
max_repairs = 1

# How many worked examples from `generate/examples.yaml` go into the prompt.
max_examples = 6

[verify]
# Decimal places floats are rounded to before two result sets are compared.
# SQLite's AVG returns a float, and two arithmetically identical queries can
# differ in the last bit; comparing raw floats would report disagreement between
# two correct answers.
float_places = 2

[answer]
# The most rows a rendered answer prints. Past a screenful an answer stops being
# an answer and becomes a table dump, which is the thing this tool exists not to
# hand back.
max_rows_shown = 20

# Whether a model may write the one-sentence phrasing above the table. Off by
# default. When it is on, every numeric token in the sentence is checked against
# the result cells and the row count, and a sentence containing a number that is
# in neither is discarded — so the guarantee holds either way, and this switch
# only decides whether the sentence is nicer.
llm_phrasing = false

# The database stores integer cents and records no currency anywhere — a
# `*_cents` column is a count, not an amount. So the currency is DECLARED here
# rather than inferred, because "1,250" is a different answer in two currencies
# and the difference is invisible.
currency = "EUR"
currency_symbol = "€"

[confidence]
# What the confidence score is made of. Integers in hundredths rather than
# floats: a threshold is a line somebody argues about in a pull request, and
# `0.55` invites a diff that reads `0.5500000001`. The division by 100 happens
# exactly once, where the score is computed.
#
# The four weights are a weighted average over the factors that APPLY to a given
# run; a factor with nothing to say (no time phrase in the question, a judge that
# could not be read, k = 1) is dropped from both halves of the fraction rather
# than counted as a pass. That is the difference between "we checked and it was
# fine" and "we never looked", and it must survive into the score.
#
# None of them may be zero. A zero weight silently disables a check while the
# report still lists it as having run.
weight_intent = 40
weight_judge = 30
weight_agreement = 20
weight_sanity = 10

# Subtracted outright when the model needed its guard findings fed back. A
# statement that had to be repaired is a statement the model got wrong once.
repair_penalty = 15

# Read top down: at or above `high_threshold` is HIGH, then MEDIUM, then LOW,
# and below `abstain_threshold` the tool refuses and shows no figures at all.
# Raising the last one makes the tool refuse more; lowering it turns refusals
# into guesses, which is the change a reviewer should question hardest.
high_threshold = 75
medium_threshold = 55
abstain_threshold = 40

[gates]
# Gates before weights. A gate answers yes or no and runs BEFORE the confidence
# arithmetic; the four weights above then rank the answers that survived it.
#
# This section exists because the first live evaluation produced two answers it
# should not have. The blind back-translation judge failed both criteria,
# unanimously, on both of them — and both were rendered anyway at MEDIUM 0.70,
# because a weighted average of four numbers cannot be dragged below a threshold
# by one of them. Raising `weight_judge` to 70 still scores 0.50. Raising
# `abstain_threshold` to 71 would refuse every run whose judge was unreadable.
# Neither lever reaches it; a veto is a different kind of rule. docs/design.md
# §§53-54.

# Whether a definite FAIL on either blind judge criterion withholds the answer
# outright, whatever the score says. On, because that judgement is the only part
# of this system that reads MEANING, and "this SQL does not answer the question"
# is a statement rather than a number to be averaged.
#
# An *unreadable* judge — a 503, a reply that would not parse — never vetoes,
# whatever this setting says, and that asymmetry is load-bearing. A silence is
# not a disagreement, and an outage that turned every answer in a deployment
# into a refusal would be a worse failure than the one this fixes. §36 already
# drops an unread judge from the score; this is the same fact one layer up.
#
# Turn it off to reproduce the pre-gate behaviour exactly. The switch is here so
# that a reader can see in one diff what changed.
judge_veto = true

# Deterministic checks whose FAIL withholds the answer. Every other check stays
# a weighted factor and can only lower a score.
#
# Two, and the shortness of the list is the argument. A hard gate has to be a
# check that cannot be wrong about English:
#
#   time_window   compares the date literals in the SQL against a window this
#                 program resolved from `[time] as_of` itself. If the question
#                 named a period and the statement's own literals do not match
#                 the window, the statement is answering a different question —
#                 arithmetic, not a heuristic.
#   not_truncated reads a flag the executor set. Either the result fitted inside
#                 the cap or it did not.
#
# `aggregation`, `entities`, `grouping`, `scalar_shape`, `top_n_rows` and
# `empty_result` stay soft. Every one of them is a word list over English with
# documented false positives, and a gate people learn to work around by
# rephrasing is worse than no gate at all. `empty_result` is a FLAG and could
# never fail anything.
#
# Every name here is checked at load time against the checks that actually
# exist. A gate on a check nobody produces would never fire and would still read
# as a control.
hard_checks = ["time_window", "not_truncated"]

[cost]
# What a run's token counts are priced at, in micro-USD per 1,000 tokens. A
# micro-USD is a millionth of a dollar, because token prices are quoted at four
# or five significant figures and cents are far too coarse for one call.
#
# Both are ZERO, which means UNPRICED and never "free". Nobody in this
# repository has entered a vendor tariff, and inventing one would put a made-up
# number in the money column of every trace. A trace records `priced: false`
# while these are zero, so a cost of 0 cannot be read as a bill of nothing.
# Fill them in from the vendor's published price list to price a run.
input_micro_usd_per_1k_tokens = 0
output_micro_usd_per_1k_tokens = 0
